; bv-Esp32-S3-claude — Claude plan usage dashboard
; Board: Waveshare ESP32-S3-Touch-LCD-1.54 (ESP32-S3R8, 16MB flash / 8MB OPI PSRAM)

[env:ws-lcd-154]
platform  = espressif32@^6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu               = esp32s3
board_build.f_cpu             = 240000000L
board_build.flash_mode        = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size       = 16MB
board_upload.maximum_size     = 16777216
board_build.partitions        = huge_app.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

lib_deps =
	lvgl/lvgl@^9.2.2
	lovyan03/LovyanGFX@^1.2.0
	bblanchon/ArduinoJson@^7.2.0

build_unflags =
	-std=gnu++11

build_flags =
	-std=gnu++17
	-I include
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=3
	; ---- LVGL 9: skip lv_conf.h, configure entirely from here ----
	-D LV_CONF_SKIP=1
	-D LV_COLOR_DEPTH=16
	; LV_STDLIB_CLIB (1): route lv_malloc() straight to the platform malloc()
	; instead of LVGL's own fixed-size pool. The board has 8 MB of PSRAM and
	; qio_opi memory_type already makes malloc() PSRAM-aware for large
	; allocations - the builtin pool (LV_MEM_SIZE) ignores all of that and
	; caps every LVGL allocation at one hardcoded number. That silently broke
	; the screenshot endpoint: a 240x240 RGB565 snapshot buffer is 112.5 KB,
	; bigger than the entire pool ever was, so lv_snapshot_take() returned
	; NULL with 8 MB of free PSRAM sitting right there unused.
	-D LV_USE_STDLIB_MALLOC=1
	-D LV_DEF_REFR_PERIOD=16
	-D LV_USE_LOG=0
	-D LV_USE_PERF_MONITOR=0
	-D LV_USE_MEM_MONITOR=0
	; needed for GET /screenshot.bmp on the settings page (off by default)
	-D LV_USE_SNAPSHOT=1
	-D LV_FONT_MONTSERRAT_10=1
	-D LV_FONT_MONTSERRAT_12=1
	-D LV_FONT_MONTSERRAT_14=1
	-D LV_FONT_MONTSERRAT_16=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_FONT_MONTSERRAT_40=1
