; bv-Esp32-S3-claude — Claude plan usage dashboard
; Board: Waveshare ESP32-S3-Touch-LCD-1.54 (ESP32-S3R8, 16MB flash / 8MB OPI PSRAM)

[env:ws-lcd-154]
platform  = espressif32@^6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.mcu               = esp32s3
board_build.f_cpu             = 240000000L
board_build.flash_mode        = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size       = 16MB
board_upload.maximum_size     = 16777216
board_build.partitions        = huge_app.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

lib_deps =
	lvgl/lvgl@^9.2.2
	lovyan03/LovyanGFX@^1.2.0
	bblanchon/ArduinoJson@^7.2.0

build_unflags =
	-std=gnu++11

build_flags =
	-std=gnu++17
	-I include
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=3
	; ---- LVGL 9: skip lv_conf.h, configure entirely from here ----
	-D LV_CONF_SKIP=1
	-D LV_COLOR_DEPTH=16
	-D LV_MEM_SIZE=98304
	-D LV_DEF_REFR_PERIOD=16
	-D LV_USE_LOG=0
	-D LV_USE_PERF_MONITOR=0
	-D LV_USE_MEM_MONITOR=0
	-D LV_FONT_MONTSERRAT_10=1
	-D LV_FONT_MONTSERRAT_12=1
	-D LV_FONT_MONTSERRAT_14=1
	-D LV_FONT_MONTSERRAT_16=1
	-D LV_FONT_MONTSERRAT_20=1
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_FONT_MONTSERRAT_40=1
